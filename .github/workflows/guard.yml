# Guard — shared gate for every UniERP repository.
# Contract: no code with a failing check reaches the remote. ERPSys/docs/ai/TRD.md § 8.
# There is deliberately NO `continue-on-error` in this file.
name: Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: Secrets · governance · hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # H03's claim-verification gate needs unierp-api's real module
      # directory to check feature claims against — the same "the gate
      # comes to the code" pattern unierp-workspace's policy-gate.yml
      # uses for its own schema-aware checks.
      - name: Check out unierp-api for the claim-verification gate
        uses: actions/checkout@v4
        with:
          repository: kannan19302/unierp-api
          path: unierp-api-sibling

      - name: Secret scan
        run: node scripts/ci/check-secrets.mjs --all

      - name: Compliance-claim gate
        run: node scripts/ci/check-compliance-claims.mjs

      - name: Claim-verification gate (H03)
        run: node scripts/ci/check-feature-claims.mjs
        env:
          UNIERP_API_PATH: ${{ github.workspace }}/unierp-api-sibling

      - name: Governance present
        run: |
          test -f GOVERNANCE.md || {
            echo "::error::GOVERNANCE.md missing — every repo must point at ERPSys/docs/ai/."
            exit 1
          }
          if [ -d docs/ai ]; then
            echo "::error::This repo must NOT fork the master docs. They live in ERPSys/docs/ai/ only."
            exit 1
          fi
          echo "✅ governance intact"

      - name: No gate bypasses
        run: |
          # H01/D138: built the search pattern from concatenated pieces so
          # this DETECTION line does not itself contain the literal strings
          # it looks for — unierp-workspace's own check-policy.mjs (a
          # separate, stricter, whole-repo HARD rule) previously flagged
          # this line as a violation of the very thing it exists to catch,
          # a false positive discovered while proving that rule against
          # this repo for the first time.
          bypass1="continue-on-error"; bypass1="${bypass1}: true"
          bypass2="--no"; bypass2="${bypass2}-verify"
          if grep -rnE "${bypass1}|${bypass2}" .github/ 2>/dev/null; then
            echo "::error::A gate bypass was found. A gate that cannot fail is worse than no gate."
            exit 1
          fi
          echo "✅ no gate bypasses"

      - name: Repo hygiene
        run: |
          if git ls-files | grep -EI "(^|/)(scratch|tmp)/|\.log$|temp_|\.bak$|\.orig$"; then
            echo "::error::One-off / temp / debug artifacts are tracked. Remove them."
            exit 1
          fi
          echo "✅ no scratch or temp artifacts tracked"
