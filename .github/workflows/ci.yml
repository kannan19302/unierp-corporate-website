# CI — unierp-corporate-website
#
# This repository previously had NO continuous integration at all: changes went straight to
# the remote unverified. Contract: no code with a failing check reaches main.
# Governance: ERPSys/docs/ai/TRD.md § 8.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  static:
    name: Static (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate

      - name: Lint
        if: matrix.check == 'lint'
        run: pnpm lint

      - name: Typecheck
        if: matrix.check == 'typecheck'
        run: pnpm exec tsc --noEmit

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Blocking — a marketing site is a public attack surface like any other.
      - run: pnpm audit --audit-level=high

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm build

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    if: always()
    needs: [static, supply-chain, codeql, build]
    steps:
      - name: Verify every gate succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Gate results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::A required gate did not succeed ($r). Red builds are never merged."
              exit 1
            fi
          done
          echo "✅ All gates green."
