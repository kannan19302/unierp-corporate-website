# ============================================================
# Local dev services for unierp-corporate-website (Plane 0)
#   - postgres (host port 5433 -> container 5432) — PostgreSQL 16
#   - web      (host port 4001 -> container 4001) — Next.js dev server
#
# Standalone stack with dedicated project name (unierp-marketing),
# isolated database volume, and non-conflicting ports (4001/5433).
# ============================================================

name: unierp-marketing

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: unerp-marketing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: unerp_marketing
      POSTGRES_USER: unerp_marketing
      POSTGRES_PASSWORD: unerp_marketing_password
    ports:
      - "5433:5432"
    volumes:
      - marketing_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unerp_marketing -d unerp_marketing"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: unerp-marketing-web
    restart: unless-stopped
    working_dir: /app
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=4096
      - PORT=4001
      - DATABASE_URL=postgresql://unerp_marketing:unerp_marketing_password@postgres:5432/unerp_marketing?schema=public
      - JWT_SECRET=${JWT_SECRET:-unierp-marketing-site-dev-secret-key-32-chars-long!}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - DEV_TENANT_DOMAIN=${DEV_TENANT_DOMAIN:-localhost}
      - ENFORCE_TENANT_HOST_MATCH=${ENFORCE_TENANT_HOST_MATCH:-true}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-superadmin@unierp.com}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-SuperAdmin@2026!}
      - SEED_ADMIN_TENANT_SLUG=${SEED_ADMIN_TENANT_SLUG:-unierp}
      - SEED_DEMO_TENANT=${SEED_DEMO_TENANT:-false}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      # File watching polling for bind mounts
      - WATCHPACK_POLLING=1000
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
    ports:
      - "4001:4001"
    volumes:
      - .:/app
      - marketing_node_modules:/app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  marketing_postgres_data:
  marketing_node_modules:
